# keyd configuration -- built-in AT keyboard defaults

[ids]
0001:0001

[main]

# Swap Esc and Caps Lock.
capslock = esc
esc = capslock

# Both Shifts together toggle Caps Lock.
leftshift+rightshift = capslock

# Keep Right Ctrl distinct. keyd's implicit layer(control) emits
# leftcontrol, which breaks apps that look for Control_R (e.g. FreeRDP's
# keyboard grab release).
rightcontrol = rightcontrol
