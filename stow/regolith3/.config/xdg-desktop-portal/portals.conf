# Copy of /usr/share/xdg-desktop-portal/regolith-portals.conf (from
# xdg-desktop-portal-regolith-x11-config 0.3.11) with Screenshot and
# ScreenCast set to none. The gtk backend implements neither, so
# xdg-desktop-portal falls back to gnome.portal via UseIn and waits ~50s
# for xdg-desktop-portal-gnome, which cannot start without GNOME Shell.
# This file replaces the system one rather than merging with it.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring

org.freedesktop.impl.portal.Background=none
org.freedesktop.impl.portal.Clipboard=none
org.freedesktop.impl.portal.InputCapture=none
org.freedesktop.impl.portal.RemoteDesktop=none
org.freedesktop.impl.portal.Wallpaper=none
org.freedesktop.impl.portal.GlobalShortcuts=none
org.freedesktop.impl.portal.Usb=none
org.freedesktop.impl.portal.Screenshot=none
org.freedesktop.impl.portal.ScreenCast=none
