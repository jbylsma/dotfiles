# Colors and font are generated from the active Regolith look by
# regolith-look-to-alacritty and written to regolith-look.toml. Missing
# imports are silently skipped, so alacritty still launches before first run.

[general]
import = ["~/.config/alacritty/regolith-look.toml"]

# Use xterm-256color instead of alacritty: its terminfo entry is missing on
# most older/embedded systems (RHEL7, Synology DSM), which breaks things like
# backspace and key bindings over SSH/tmux.
[env]
TERM = "xterm-256color"

[bell]
animation = "EaseOutExpo"
duration = 100
color = "#555555"

[cursor]
style = { shape = "Block", blinking = "On" }

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
  { key = "+", mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "=", mods = "Control", action = "None" },
  # Toggle a light (lightness-inverted) Regolith palette with a white
  # background on the focused window. Run via sh so $HOME expands; ~/usr/bin isn't on Alacritty's PATH.
  { key = "L", mods = "Control|Shift", command = { program = "sh", args = [
    "-c",
    'exec "$HOME/usr/bin/alacritty-theme-toggle" --invert --background "#FFFFFF" "$HOME/.config/alacritty/regolith-look.toml"',
  ] } },
]

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "Control" }
binding = { key = "O", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
